function splitDialogue(text){
  const paras=text.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  const chunks=[];
  const MAX=58;
  paras.forEach(p=>{
    if(p.length<=MAX){chunks.push(p);return;}
    let rest=p;
    while(rest.length>MAX){
      let cut=-1;
      const candidates=['。','！','？','」','、'];
      candidates.forEach(mark=>{const pos=rest.lastIndexOf(mark,MAX); if(pos>cut) cut=pos;});
      if(cut<28) cut=MAX;
      chunks.push(rest.slice(0,cut+1).trim());
      rest=rest.slice(cut+1).trim();
    }
    if(rest) chunks.push(rest);
  });
  return chunks.length?chunks:[''];
}

        nextBtn.style.display='block'; nextBtn.hidden=false; nextBtn.onclick=goNext;
      };
      ch.insertBefore(b,nextBtn);
    });
  }else{
    nextBtn.style.display='block'; nextBtn.hidden=false; nextBtn.onclick=goNext;
  }
}

function goNext(){
  i++;
  chunkIndex=0;
  if(i>=S.length){
    ch.innerHTML='';
    en.style.display='block';
    return;
  }
  render();
}

function render(){
  en.style.display='none';
  chunkIndex=0;
  const s=S[i];
  sp.textContent=s[0];
  lb.textContent=s[1];
  const L=s[1]+s[2];
  visual.style.backgroundImage=`url("${L.includes("スポーツフェスティバル")?BG.ground:L.includes("ファストフード")||L.includes("休日")||L.includes("雨宿り")?BG.restaurant:L.includes("終業式")||L.includes("夏の別れ")||L.includes("最終日")?BG.entrance:BG.classroom}")`;
  const person=(s[0]==="紗季"||s[0]==="白石結花")?(s[0]==="白石結花"?CH.female2:CH.female):(s[0]==="健太"||s[0]==="僕"||s[0]==="佐藤先生")?CH.male:CH.male2;
  character.style.backgroundImage=`url("${person}")`;
  showCurrentChunk();
}
render();
</script></body></html>
