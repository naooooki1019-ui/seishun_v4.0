function apply(e){for(const[k,v] of Object.entries(e||{})){if(k==="club"){S.club=v;continue}if(k==="clubScore"){S.score.club+=v;continue}if(k==="teacher"||k==="study"||k==="event"||k==="class"||k==="friend"||k==="romance"){S.score[k]+=v;continue}if(S.rel[k]!=null)S.rel[k]+=v}}
function person(n){let x=(n||"僕").split("・")[0];return `<div class="person"><div class="hair"></div><div class="head"></div><div class="body"></div><div class="name">${x}</div></div>`}
function render(){if(S.i>=W.length)return end();let w=W[S.i];document.getElementById("date").textContent=w[0];document.getElementById("cond").textContent=S.cond;document.getElementById("money").textContent=S.money.toLocaleString();document.getElementById("club").textContent=S.club||"未選択";let a=document.getElementById("app");
if(S.p<w[3].length){let q=w[3][S.p];a.innerHTML=`<div class="top"><span class="place">${w[1]}</span><span>${S.p+1}/${w[3].length}</span></div><div class="visual">${person(q[0])}</div><div class="dialogue"><div class="speaker">${q[0]}</div><div class="text">${q[1]}</div><div class="next"><button class="btn" onclick="S.p++;render()">次へ</button></div></div>`}
else{a.innerHTML=`<div class="top"><span class="place">${w[1]}</span><span>選択</span></div><div class="visual">${person(w[2])}</div><div class="dialogue"><div class="speaker">僕</div><div class="text">どうする？</div><div class="choices">${w[4].map((c,i)=>`<button class="choice" onclick="choose(${i})">${i+1}. ${c[0]}</button>`).join("")}</div></div>`}}

function next(){S.i++;S.p=0;S.cond=Math.max(60,S.cond-1);render()}
